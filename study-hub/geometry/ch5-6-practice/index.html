<body>
<div class="top"><div class="wrap"><a class="back" href="../../">‹ Learning Hub</a><h1>📐 Geometry Ch 5–6 Test</h1><p>Congruent Triangles &amp; Relationships Within Triangles · 几何 5–6 章模拟考</p></div></div>
<div id="timerbar"></div>
<main><div class="wrap" id="app"></div></main>
<script>
/* Geometry Ch 5-6 test generator: 10 multi-step questions, 36 raw points -> scaled to 40. */
(function(root){
'use strict';
const M='\u2212', DEG='\u00B0', ANG='\u2220', TRI='\u25B3', CONG='\u2245';
function rng(seed){let s=seed>>>0;const f=()=>{s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296};
  return {f,int:(a,b)=>a+Math.floor(f()*(b-a+1)),pick:a=>a[Math.floor(f()*a.length)],shuffle:a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(f()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}}}
const sg=n=>n<0?M+(-n):String(n);
// polynomial text  c2 v^2 + c1 v + c0
function poly(c2,c1,c0,v){v=v||'x';const out=[];const add=(c,t)=>{if(c===0)return;const ab=Math.abs(c);const body=(t&&ab===1)?t:(ab+t);out.push([c<0,body])};
  add(c2,v+'\u00B2');add(c1,v);add(c0,'');if(!out.length)return '0';
  return out.map(([neg,b],i)=>i===0?(neg?M+b:b):(neg?' '+M+' ':' + ')+b).join('')}
const lin=(a,b,v)=>poly(0,a,b,v);
const fac=(r,v)=>'('+(v||'x')+(r>=0?' '+M+' '+r:' + '+(-r))+')';
const rule=s=>`<div class="sp">${s}</div>`;
const steps=a=>'<ol class="steps">'+a.map(s=>'<li>'+s+'</li>').join('')+'</ol>';
const I=s=>'<i>'+s+'</i>';
function mkQuad(R,r1,r2,m,n,lim){ // x^2+a x+c = m x+n has roots r1,r2
  const a=m-(r1+r2), c=n+r1*r2; if(Math.abs(a)>(lim||10)||Math.abs(c)>(lim?lim*4:45))return null; return {a,c}}
function quadSolText(v,qa,qc,m,n,r1,r2){ // v: 'x'
  const A=qa-m, C=qc-n;
  return `Set the two expressions equal: ${poly(1,qa,qc,v)} = ${lin(m,n,v)}. Move everything to one side: ${poly(1,A,C,v)} = 0. Factor: ${fac(r1,v)}${fac(r2,v)} = 0, so ${I(v)} = ${r1} or ${I(v)} = ${sg(r2)}.`}

/* diagrams */
const T=(x,y,s,a,c)=>`<text x="${x}" y="${y}" text-anchor="${a||'middle'}" class="${c||''}">${s}</text>`;
const Ln=(x1,y1,x2,y2,c)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="${c||''}"/>`;
const Pg=p=>`<polygon points="${p.map(q=>q.join(',')).join(' ')}"/>`;
const Dot=(x,y)=>`<circle cx="${x}" cy="${y}" r="3" class="pt"/>`;
const SVG=(b,h)=>`<svg viewBox="0 0 280 ${h||165}" class="dg" role="img" xmlns="http://www.w3.org/2000/svg">${b}</svg>`;

/* ---------- Q1: congruent parts, quadratic, valid root ---------- */
function q1(R){for(;;){const r1=R.int(3,9),r2=-R.int(1,7),m=R.int(2,5),n=R.int(-4,6);const val=m*r1+n;if(val<8||val>60||m*r2+n>0)continue;const qd=mkQuad(R,r1,r2,m,n);if(!qd)continue;
  const bc=R.int(6,15),df=R.int(8,20),per=val+bc+df;
  return {topic:'5.2 Congruent polygons (quadratic)',pts:4,
   text:`${TRI}ABC ${CONG} ${TRI}DEF. AB = (${poly(1,qd.a,qd.c)}), DE = (${lin(m,n)}), BC = ${bc}, and DF = ${df}.<br>(a) Solve for ${I('x')}. Only one root gives a possible side length. (b) Find AB. (c) Find the perimeter of ${TRI}ABC.`,
   parts:[{l:'(a) x',ans:r1,pts:2},{l:'(b) AB',ans:val,pts:1},{l:'(c) perimeter of '+TRI+'ABC',ans:per,pts:1}],
   sol:steps([`Corresponding sides of congruent triangles are congruent, so AB = DE. ${quadSolText('x',qd.a,qd.c,m,n,r1,r2)}`,
     `Check each root in a side length: ${I('x')} = ${sg(r2)} makes DE = ${lin(m,n).replace(/x/g,'('+sg(r2)+')')} = ${sg(m*r2+n)}, which is not a positive length, so reject it. <b>${I('x')} = ${r1}</b>.`,
     `AB = DE = ${m}(${r1}) ${n<0?M+' '+(-n):'+ '+n} = <b>${val}</b>.`,
     `AC ${CONG} DF (corresponding sides), so AC = ${df}. Perimeter = ${val} + ${bc} + ${df} = <b>${per}</b>.`]),
   params:{kind:1,r1,r2,m,n,a:qd.a,c:qd.c,bc,df}}}}

/* ---------- Q2: isosceles with quadratic angle expressions ---------- */
function q2(R){for(;;){const r1=R.int(4,9),r2=-R.int(1,8),m=R.int(3,6),n=R.int(-10,10);const Bv=m*r1+n;if(Bv<32||Bv>76||m*r2+n>0)continue;const qd=mkQuad(R,r1,r2,m,n);if(!qd)continue;
  const V=180-2*Bv;
  const svg=SVG(Pg([[140,18],[40,140],[240,140]])+T(140,12,'A')+T(30,150,'B','end')+T(250,150,'C','start')+T(70,134,`(${poly(1,qd.a,qd.c)})${DEG}`,'start','sm')+T(210,134,`(${lin(m,n)})${DEG}`,'end','sm')+Ln(88,72,96,76)+Ln(184,76,192,72));
  return {topic:'5.1/5.4 Isosceles triangles (quadratic)',pts:4,svg,
   text:`${TRI}ABC is isosceles with AB ${CONG} AC. m${ANG}B = (${poly(1,qd.a,qd.c)})${DEG} and m${ANG}C = (${lin(m,n)})${DEG}. Only one solution for ${I('x')} gives a real triangle.<br>(a) Find ${I('x')}. (b) Find m${ANG}B. (c) Find the vertex angle m${ANG}A.`,
   parts:[{l:'(a) x',ans:r1,pts:2},{l:'(b) m\u2220B (degrees)',ans:Bv,pts:1},{l:'(c) m\u2220A (degrees)',ans:V,pts:1}],
   sol:steps([`AB ${CONG} AC, so the base angles are congruent (Base Angles Theorem): ${ANG}B = ${ANG}C. ${quadSolText('x',qd.a,qd.c,m,n,r1,r2)}`,
     `${I('x')} = ${sg(r2)} makes ${ANG}C = ${sg(m*r2+n)}${DEG}, which is not a possible angle. Reject it: <b>${I('x')} = ${r1}</b>.`,
     `m${ANG}B = ${m}(${r1}) ${n<0?M+' '+(-n):'+ '+n} = <b>${Bv}${DEG}</b> (and ${ANG}C is the same).`,
     `Angle sum: m${ANG}A = 180 ${M} 2(${Bv}) = <b>${V}${DEG}</b>.`]),
   params:{kind:2,r1,r2,m,n,a:qd.a,c:qd.c}}}}

/* ---------- Q3: theorem + CPCTC ---------- */
function q3(R){for(;;){const x0=R.int(3,10),a=R.int(2,6),c=R.int(1,6),b=R.int(-5,8);if(a===c)continue;const AB=a*x0+b;if(AB<8||AB>50)continue;const d=AB-c*x0;if(d<-8||d>12)continue;
  const y0=R.int(3,9),p=R.int(2,6),r=R.int(1,6),qq=R.int(-6,8);if(p===r)continue;const AC=p*y0+qq;if(AC<10||AC>60)continue;const s=AC-r*y0;if(s<-10||s>12)continue;
  const v=R.pick(['SAS','ASA']);const k=R.int(6,14);
  const given=v==='SAS'?`It is also given that BC = EF = ${k} and ${ANG}B ${CONG} ${ANG}E.`:`It is also given that ${ANG}A ${CONG} ${ANG}D and ${ANG}B ${CONG} ${ANG}E.`;
  const opts=['SAS','SSS','ASA','AAS','HL'];
  return {topic:'5.3\u20135.7 Congruence theorem + CPCTC',pts:4,
   text:`In ${TRI}ABC and ${TRI}DEF, AB = (${lin(a,b)}) and DE = (${lin(c,d)}) are corresponding sides, and AB ${CONG} DE. ${given}<br>(a) Find ${I('x')}. (b) Which theorem proves ${TRI}ABC ${CONG} ${TRI}DEF? Then, since AC = (${lin(p,qq,'y')}) and DF = (${lin(r,s,'y')}): (c) use CPCTC to find ${I('y')}. (d) Find AC.`,
   parts:[{l:'(a) x',ans:x0,pts:1},{l:'(b) theorem',type:'mc',opts,ans:opts.indexOf(v),pts:1},{l:'(c) y',ans:y0,pts:1},{l:'(d) AC',ans:AC,pts:1}],
   sol:steps([`AB ${CONG} DE: ${lin(a,b)} = ${lin(c,d)} → ${a-c}x = ${d-b} → <b>${I('x')} = ${x0}</b> (AB = DE = ${AB}).`,
     v==='SAS'?`We now have AB ${CONG} DE, BC ${CONG} EF, and ${ANG}B ${CONG} ${ANG}E. ${ANG}B is the angle <i>between</i> AB and BC, so it is <b>SAS</b>.`:`We now have ${ANG}A ${CONG} ${ANG}D, AB ${CONG} DE, and ${ANG}B ${CONG} ${ANG}E. AB is the side <i>between</i> the two angles, so it is <b>ASA</b>.`,
     `Corresponding parts of congruent triangles are congruent (CPCTC), so AC ${CONG} DF: ${lin(p,qq,'y')} = ${lin(r,s,'y')} → ${p-r}y = ${s-qq} → <b>${I('y')} = ${y0}</b>.`,
     `AC = ${p}(${y0}) ${qq<0?M+' '+(-qq):'+ '+qq} = <b>${AC}</b> (DF = ${AC} as well).`]),
   params:{kind:3,x0,a,b,c,d,y0,p,qq,r,s,v}}}}

/* ---------- Q4: centroid 2:1 with expressions (two medians) ---------- */
function q4(R){for(;;){const x0=R.int(2,8),c=R.int(1,4),d=R.int(-3,8),PD=c*x0+d;if(PD<3)continue;const AP=2*PD,a=R.int(3,9);if(a===2*c)continue;const b=AP-a*x0;if(Math.abs(b)>9)continue;
  const y0=R.int(2,8),g=R.int(1,3),h=R.int(-2,6),PE=g*y0+h;if(PE<3)continue;const e=R.int(3,8);if(e===2*g)continue;const f=2*PE-e*y0;if(Math.abs(f)>9)continue;
  const svg=SVG(Pg([[140,14],[30,140],[250,140]])+Ln(140,14,140,140,'dsh')+Ln(30,140,195,77,'dsh')+Dot(140,98)+T(140,10,'A')+T(22,150,'B','end')+T(258,150,'C','start')+T(146,152,'D','start')+T(204,74,'E','start')+T(146,92,'P','start')+
    T(134,60,`AP=${lin(a,b)}`,'end','sm')+T(146,128,`PD=${lin(c,d)}`,'start','sm')+T(64,102,`BP=${lin(e,f,'y')}`,'middle','sm')+T(196,106,`PE=${lin(g,h,'y')}`,'middle','sm'));
  return {topic:'6.3 Medians & centroid (2:1)',pts:4,svg,
   text:`P is the centroid of ${TRI}ABC. AD and BE are medians. AP = (${lin(a,b)}) and PD = (${lin(c,d)}); BP = (${lin(e,f,'y')}) and PE = (${lin(g,h,'y')}).<br>(a) Find ${I('x')}. (b) Find the length of median AD. (c) Find ${I('y')}. (d) Find the length of median BE.`,
   parts:[{l:'(a) x',ans:x0,pts:1},{l:'(b) AD',ans:3*PD,pts:1},{l:'(c) y',ans:y0,pts:1},{l:'(d) BE',ans:3*PE,pts:1}],
   sol:steps([`Centroid Theorem: the centroid is 2/3 of the way from a vertex, so AP = 2\u00B7PD. ${lin(a,b)} = 2(${lin(c,d)}) → ${lin(a,b)} = ${lin(2*c,2*d)} → ${a-2*c}x = ${2*d-b} → <b>${I('x')} = ${x0}</b>.`,
     `AP = ${2*PD}, PD = ${PD}, so AD = AP + PD = <b>${3*PD}</b>.`,
     `BP = 2\u00B7PE: ${lin(e,f,'y')} = ${lin(2*g,2*h,'y')} → ${e-2*g}y = ${2*h-f} → <b>${I('y')} = ${y0}</b>.`,
     `BP = ${2*PE}, PE = ${PE}, so BE = <b>${3*PE}</b>.`]),
   params:{kind:4,x0,a,b,c,d,y0,e,f,g,h}}}}

/* ---------- Q5: midsegment ---------- */
function q5(R){for(;;){const x0=R.int(4,12),a=R.int(1,3),b=R.int(-3,6),DE=a*x0+b;if(DE<4)continue;const AC=2*DE,c=R.int(3,8);if(c===2*a)continue;const d=AC-c*x0;if(Math.abs(d)>14)continue;
  const AB=2*R.int(10,30),BC=2*R.int(10,30);const per=(AB+BC+AC)/2;
  const svg=SVG(Pg([[140,14],[30,140],[250,140]])+Ln(85,77,195,77,'dsh')+Dot(85,77)+Dot(195,77)+T(140,10,'B')+T(22,150,'A','end')+T(258,150,'C','start')+T(78,76,'D','end')+T(202,76,'E','start')+T(140,70,`DE=${lin(a,b)}`,'middle','sm')+T(140,158,`AC=${lin(c,d)}`,'middle','sm'));
  return {topic:'6.4 Midsegment theorem',pts:4,svg,
   text:`In ${TRI}ABC, D and E are the midpoints of AB and BC. DE = (${lin(a,b)}) and AC = (${lin(c,d)}). Also AB = ${AB} and BC = ${BC}. F is the midpoint of AC.<br>(a) Find ${I('x')}. (b) Find AC. (c) Find the perimeter of the midsegment triangle ${TRI}DEF.`,
   parts:[{l:'(a) x',ans:x0,pts:1},{l:'(b) AC',ans:AC,pts:1},{l:'(c) perimeter of '+TRI+'DEF',ans:per,pts:2}],
   sol:steps([`DE joins two midpoints, so by the Triangle Midsegment Theorem DE = \u00BD\u00B7AC, i.e. AC = 2\u00B7DE. ${lin(c,d)} = 2(${lin(a,b)}) = ${lin(2*a,2*b)} → ${c-2*a}x = ${2*b-d} → <b>${I('x')} = ${x0}</b>.`,
     `DE = ${DE}, so AC = <b>${AC}</b>.`,
     `Each side of ${TRI}DEF is half of the side it is parallel to: DE = ${AC}/2 = ${DE}, EF = AB/2 = ${AB/2}, DF = BC/2 = ${BC/2}.`,
     `Perimeter = ${DE} + ${AB/2} + ${BC/2} = <b>${per}</b> (half of the perimeter of ${TRI}ABC, ${AB+BC+AC}).`]),

function classify(P){const d=[0,1,2].map(i=>{const A=P[i],B=P[(i+1)%3];return (A[0]-B[0])**2+(A[1]-B[1])**2}).sort((x,y)=>x-y);

  return {id:'E',topic:'5.5/5.7 Proof: SSS + midpoint + CPCTC',svg,

   rows:[{s:cg(a+b,a+c),r:'Given',u:0,note:`${tr(a,b,c)} is isosceles.`},

    {s:cg(tr(a,b,d),tr(a,c,d)),r:'SSS Congruence Theorem',u:1,note:`All three pairs of sides are congruent: ${a}${b}${CONG}${a}${c}, ${b}${d}${CONG}${c}${d}, ${a}${d}${CONG}${a}${d}.`},

  return {id:'F',topic:'6.1/5.5 Proof: Perpendicular bisector + SSS + CPCTC',svg,
   given:[`${p}${q} is the perpendicular bisector of ${a}${b}`],prove:cg(an(p,a,q),an(p,b,q)),
   rows:[{s:`${p}${q} is the perpendicular bisector of ${a}${b}`,r:'Given',u:0,note:`${p} and ${q} lie on the perpendicular bisector.`},
    {s:cg(p+a,p+b),r:'Perpendicular Bisector Theorem',u:0,note:`${p} is on the perpendicular bisector of ${a}${b}, so it is equidistant from ${a} and ${b}.`},
    {s:cg(q+a,q+b),r:'Perpendicular Bisector Theorem',u:0,note:`${q} is also on the perpendicular bisector, so ${q}${a} ${CONG} ${q}${b}.`},

    {s:cg(an(p,a,q),an(p,b,q)),r:'CPCTC',u:1,note:'Corresponding parts of congruent triangles are congruent.'}],
   pats:[[[1,'R'],[2,'R'],[3,'R'],[4,'B'],[5,'B'],[6,'S']],[[1,'R'],[2,'R'],[3,'R'],[4,'S'],[5,'B'],[6,'B']]],
   dist:[cg(an(a,p,q),an(b,p,q)),cg(tr(a,p,q),tr(b,q,p)),cg(a+m,p+m),cg(a+b,p+q)]}},

    T(140,12,a)+T(32,152,b,'end')+T(248,152,c,'start')+T(140,154,d));
  return {id:'G',topic:'5.4/5.6 Proof: Base angles + AAS + CPCTC',svg,
   given:[cg(a+b,a+c),`${a}${d} \u22A5 ${b}${c}`],prove:cg(b+d,c+d),
   rows:[{s:cg(a+b,a+c),r:'Given',u:0,note:`${tr(a,b,c)} is isosceles with vertex ${a}.`},
    {s:cg(an(b),an(c)),r:'Base Angles Theorem',u:1,note:`Angles opposite congruent sides ${a}${c} and ${a}${b} are congruent.`},
    {s:`${a}${d} \u22A5 ${b}${c}`,r:'Given',u:0,note:'The altitude is perpendicular to the base.'},
    {s:`${an(a,d,b)} and ${an(a,d,c)} are right angles`,r:'Definition of perpendicular lines',u:1,note:'Perpendicular lines meet at right angles.'},
    {s:cg(an(a,d,b),an(a,d,c)),r:'Right Angles Congruence Theorem',u:1,note:'All right angles are congruent.'},
    {s:cg(a+d,a+d),r:'Reflexive Property of Congruence',u:1,note:`${a}${d} is a side of both triangles.`},
    {s:cg(tr(a,b,d),tr(a,c,d)),r:'AAS Congruence Theorem',u:1,note:`${an(b)} ${CONG} ${an(c)}, ${an(a,d,b)} ${CONG} ${an(a,d,c)}, and the non-included side ${a}${d}.`},
    {s:cg(b+d,c+d),r:'CPCTC',u:1,note:`Corresponding parts of congruent triangles are congruent. (So ${d} is the midpoint of ${b}${c}.)`}],
   pats:[[[1,'R'],[2,'S'],[3,'R'],[4,'R'],[5,'S'],[6,'R'],[7,'S'],[8,'R']],[[1,'R'],[2,'R'],[3,'R'],[4,'S'],[5,'R'],[6,'S'],[7,'R'],[8,'S']]],
   dist:[cg(an(a),an(b)),cg(an(b,a,d),an(c,a,d)),cg(tr(a,b,d),tr(a,d,c)),cg(a+d,b+c)]}}
};
function mkProof(R,id){const need={A:5,B:4,C:4,D:4,E:4,F:5,G:4}[id];const L=R.shuffle(LETTERS).slice(0,need);const t=PT[id](R,L);
  const pat=R.pick(t.pats);const blanks=[];pat.forEach(([row,k])=>{if(k!=='R')blanks.push([row,'S']);if(k!=='S')blanks.push([row,'R'])});
  const sTruths=blanks.filter(b=>b[1]==='S').map(b=>t.rows[b[0]-1].s);
  const sOpts=R.shuffle(sTruths.concat(t.dist.filter(x=>!t.rows.some(r=>r.s===x)).slice(0,3)));
  const parts=blanks.map(([row,k])=>{const rw=t.rows[row-1];
    return k==='S'?{l:`Row ${row} \u2013 Statement`,type:'dd',opts:sOpts,ans:sOpts.indexOf(rw.s),pts:0.5,row,col:'S'}:{l:`Row ${row} \u2013 Reason`,type:'dd',opts:REASONS,ans:REASONS.indexOf(rw.r),pts:0.5,row,col:'R'}});
  parts.forEach((p,i)=>{const rw=t.rows[p.row-1];rw[p.col==='S'?'bs':'br']=i});
  const sol=steps([`<b>Plan:</b> show that two triangles are congruent (${t.rows.find(r=>/Congruence Theorem$/.test(r.r)&&/\u25B3/.test(r.s)).r.split(' ')[0]}), then use CPCTC to reach the <i>Prove</i> statement.`].concat(t.rows.map((r,i)=>`<b>${r.s}</b> \u2014 <i>${r.r}</i>. ${r.note}`)));
  return {topic:t.topic,pts:parts.length*0.5,svg:t.svg,
   text:`<b>Given:</b> ${t.given.join('; ')}<br><b>Prove:</b> ${t.prove}<br>Complete the two-column proof: choose the correct statement or reason for each blank (\u25BE).`,
   parts,sol,params:{kind:11,id,L,rows:t.rows.map(r=>({s:r.s,r:r.r,u:r.u,bs:r.bs,br:r.br})),given:t.given,prove:t.prove,sOpts},
   proof:{given:t.given,prove:t.prove,rows:t.rows.map(r=>({s:r.s,r:r.r,bs:r.bs,br:r.br}))}}}
function pickProofs(R){const first=R.pick(['F','G']);const rest=R.shuffle(['A','B','C','D','E']).slice(0,2);return R.shuffle([first].concat(rest))}

function makeTest(seed){const R=rng(seed*7919+13);const qs=[q1,q2,q3,q4,q5,q6,q7,q8,q9,q10].map((g,i)=>{const q=g(R);q.n=i+1;
  q.parts.forEach(p=>{if(p.type==='mc')return;p.type='num';p.tol=p.tol||0.01});
  q.svg=q.svg||'';return q});
  pickProofs(R).forEach((id,j)=>{const q=mkProof(R,id);q.n=11+j;qs.push(q)});return qs}
const totalOf=T=>T.reduce((s,q)=>s+q.parts.reduce((a,p)=>a+p.pts,0),0);
const api={makeTest,totalOf,rng,classify,CL,REASONS};
if(typeof module==='object'&&module.exports)module.exports=api;else root.GEO56=api;
})(typeof self!=='undefined'?self:this);

<script>
const KEY='geo56v4', SECS=55*60; let TOTAL=48;
const $=s=>document.querySelector(s), app=$('#app');
const store={get(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){return null}},set(v){try{localStorage.setItem(KEY,JSON.stringify(v))}catch(e){}},clear(){try{localStorage.removeItem(KEY)}catch(e){}}};
let S=null,T=null,timerH=null;
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
function parseNum(s){s=String(s).replace(/[\u2212\u2013\u2014]/g,'-').replace(/,/g,'');const m=s.match(/-?\d+(?:\.\d+)?(?:\s*\/\s*\d+)?|-?\.\d+/g);if(!m)return NaN;const t=m[m.length-1].replace(/\s/g,'');if(t.includes('/')){const [a,b]=t.split('/');return parseFloat(a)/parseFloat(b)}return parseFloat(t)}
function partOk(p,a){if(a===undefined||a===null||a==='')return false;if(p.type==='mc'||p.type==='dd')return Number(a)===p.ans;const n=parseNum(a);return !isNaN(n)&&Math.abs(n-p.ans)<=p.tol}
const fmt=s=>{s=Math.max(0,s);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const fnum=x=>Number.isInteger(x)?String(x):x.toFixed(2).replace(/0+$/,'').replace(/\.$/,'');

function home(){
  clearInterval(timerH);$('#timerbar').innerHTML='';
  const sv=store.get();
  app.innerHTML=`<div class="card">
  <div class="row">${sv&&!sv.done?`<button class="pri" id="bRes">▶ Resume test (version ${sv.seed})</button><button class="ghost" id="bNew">Start a new test</button>`:`<button class="pri" id="bNew">▶ Start the test</button>`}</div>
  ${sv&&sv.done?`<p><small class="m">Last result: <b>${esc(sv.last||'')}</b></small></p>`:''}</div>`;
  const r=$('#bRes');if(r)r.onclick=()=>begin(sv);
  $('#bNew').onclick=()=>{if(sv&&!sv.done&&!confirm('Discard the unfinished test and start a new one?'))return;begin({seed:1+Math.floor(Math.random()*899999),ans:{},work:{},end:Date.now()+SECS*1000,done:false})};
  window.scrollTo(0,0);
}
function setT(){T=GEO56.makeTest(S.seed);TOTAL=GEO56.totalOf(T)}
function begin(st){S=st;setT();store.set(S);clearInterval(timerH);timerH=setInterval(tick,500);renderTest();tick()}
function allParts(){const o=[];T.forEach(q=>q.parts.forEach((p,i)=>o.push([q,p,i])));return o}
function answered(){return allParts().filter(([q,p,i])=>{const a=S.ans[q.n+'.'+i];return a!==undefined&&a!==''}).length}
function tick(){if(!S||S.done){clearInterval(timerH);$('#timerbar').innerHTML='';return}
  const left=Math.round((S.end-Date.now())/1000);
  $('#timerbar').innerHTML=`<div class="timer${left<300?' low':''}"><span>⏱ ${fmt(left)}</span><span>${answered()}/${allParts().length} answers</span></div>`;
  if(left<=0){alert("Time's up! Submitting your test.");submit(true)}}
function renderTest(){
  const sel=(q,p,i)=>{const k=q.n+'.'+i,v=S.ans[k],has=v!==undefined&&v!=='';return `<select class="dd${has?' has':''}" data-k="${k}" aria-label="${esc(p.l)}"><option value="">\u2014 choose \u2014</option>${p.opts.map((o,j)=>`<option value="${j}"${has&&String(v)===String(j)?' selected':''}>${esc(o)}</option>`).join('')}</select>`};
  const cell=(q,r,col)=>{const bi=col==='S'?r.bs:r.br;return bi===undefined?esc(col==='S'?r.s:r.r):sel(q,q.parts[bi],bi)};
  app.innerHTML=T.map(q=>q.proof?`<div class="card"><div class="qh"><span class="tag">${esc(q.topic)}</span><span class="pts">${fnum(q.pts)} pts</span></div>
   <div class="qn">Question ${q.n} \u00B7 Two-column proof</div>${q.svg}<div class="q">${q.text}</div>
   <table class="pf"><tr><th></th><th>Statements</th><th>Reasons</th></tr>${q.proof.rows.map((r,i)=>`<tr><td class="n"><span class="sw">Step </span>${i+1}</td><td data-l="Statement">${cell(q,r,'S')}</td><td data-l="Reason">${cell(q,r,'R')}</td></tr>`).join('')}</table></div>`:
   `<div class="card"><div class="qh"><span class="tag">${esc(q.topic)}</span><span class="pts">${q.pts} pts</span></div>
   <div class="qn">Question ${q.n}</div>${q.svg}<div class="q">${q.text}</div>
   ${q.parts.map((p,i)=>{const k=q.n+'.'+i,v=S.ans[k];return p.type==='mc'?
     `<div class="part"><label>${esc(p.l)}</label><div class="chips" data-k="${k}">${p.opts.map((o,j)=>`<button class="chip${String(v)===String(j)?' sel':''}" data-j="${j}">${esc(o)}</button>`).join('')}</div></div>`:
     `<div class="part"><label for="i${k}">${esc(p.l)}</label><input class="ans" id="i${k}" data-k="${k}" inputmode="decimal" autocomplete="off" autocapitalize="off" value="${v!==undefined?esc(v):''}"></div>`}).join('')}
   <textarea class="work" data-w="${q.n}" placeholder="Show your work here (not graded, but it helps you)">${esc(S.work[q.n]||'')}</textarea></div>`).join('')+
   `<div class="row"><button class="warn" id="bSub" style="width:100%">Submit test</button></div>`;
  document.querySelectorAll('select.dd').forEach(e=>e.addEventListener('change',()=>{S.ans[e.dataset.k]=e.value===''?'':+e.value;e.classList.toggle('has',e.value!=='');store.set(S);tick()}));
  document.querySelectorAll('input.ans').forEach(i=>i.addEventListener('input',()=>{S.ans[i.dataset.k]=i.value;store.set(S);tick()}));
  document.querySelectorAll('textarea.work').forEach(t=>t.addEventListener('input',()=>{S.work[t.dataset.w]=t.value;store.set(S)}));
  document.querySelectorAll('.chips').forEach(c=>c.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{S.ans[c.dataset.k]=+b.dataset.j;store.set(S);c.querySelectorAll('.chip').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');tick()}));
  $('#bSub').onclick=()=>{const un=allParts().length-answered();if(confirm(un?`${un} answer box(es) are blank. Submit anyway?`:'Submit your test?'))submit()};
  window.scrollTo(0,0);
}
function submit(auto){if(S.done&&!auto)return;S.done=true;S.used=Math.min(SECS,SECS-Math.max(0,Math.round((S.end-Date.now())/1000)));clearInterval(timerH);$('#timerbar').innerHTML='';
  const res=T.map(q=>{const rows=q.parts.map((p,i)=>({p,a:S.ans[q.n+'.'+i],ok:partOk(p,S.ans[q.n+'.'+i])}));return {q,rows,earned:rows.reduce((s,r)=>s+(r.ok?r.p.pts:0),0)}});
  const raw=res.reduce((s,r)=>s+r.earned,0),scaled=raw/TOTAL*40;
  S.last=`${scaled.toFixed(1)}/40 (${raw}/${TOTAL} raw)`;store.set(S);results(res,raw,scaled)}
function proofReview(r){const q=r.q;
  const cell=(row,col)=>{const bi=col==='S'?row.bs:row.br;const txt=col==='S'?row.s:row.r;if(bi===undefined)return esc(txt);const x=r.rows[bi];
    if(x.ok)return `<div class="okc" style="padding:4px;border-radius:6px">\u2705 ${esc(txt)}</div>`;
    const mine=x.a===undefined||x.a===''?'<i>(blank)</i>':esc(x.p.opts[x.a]);return `<div class="badcell" style="padding:4px;border-radius:6px">\u274C <s>${mine}</s><br><b>${esc(txt)}</b></div>`};
  return `<table class="pf"><tr><th></th><th>Statements</th><th>Reasons</th></tr>${q.proof.rows.map((row,i)=>`<tr><td class="n"><span class="sw">Step </span>${i+1}</td><td data-l="Statement">${cell(row,'S')}</td><td data-l="Reason">${cell(row,'R')}</td></tr>`).join('')}</table><small class="m">Green = correct. Red shows your choice crossed out and the right answer. Each blank is worth 0.5 pt.</small>`}
function results(res,raw,scaled){
  const pct=Math.round(100*raw/TOTAL),weak=res.filter(r=>r.earned/r.q.pts<0.7).sort((a,b)=>a.earned/a.q.pts-b.earned/b.q.pts);
  const show=(p,a)=>{if(a===undefined||a==='')return '<i>(blank)</i>';return p.type==='mc'?esc(p.opts[a]):esc(a)};
  const key=p=>p.type==='mc'?esc(p.opts[p.ans]):fnum(p.ans);
  app.innerHTML=`<div class="card" style="text-align:center"><div class="tag">Test result</div><div class="big">${scaled.toFixed(1)} / 40</div><div><b>${pct}%</b> · ${raw}/${TOTAL} raw points · time used ${fmt(S.used||0)}</div></div>
  <div class="card"><b>${weak.length?'Weak topics to review':'No weak topics 🎉'}</b>${weak.map(r=>`<div class="wk"><b>Q${r.q.n}</b> ${esc(r.q.topic)}: ${fnum(r.earned)}/${fnum(r.q.pts)} pts</div>`).join('')}
   <table style="margin-top:10px"><tr><th>Q</th><th>Topic</th><th style="text-align:right">Score</th></tr>${res.map(r=>`<tr><td>${r.q.n}</td><td>${esc(r.q.topic)}</td><td style="text-align:right"><span class="${r.earned===r.q.pts?'good':r.earned===0?'badc':''}">${fnum(r.earned)}/${fnum(r.q.pts)}</span></td></tr>`).join('')}</table></div>
  ${res.map(r=>`<div class="card"><div class="qh"><span class="tag">${esc(r.q.topic)}</span><span class="pts">${fnum(r.earned)}/${fnum(r.q.pts)} pts</span></div><div class="qn">Question ${r.q.n}${r.q.proof?' \u00B7 Two-column proof':''}</div>${r.q.svg}<div class="q">${r.q.text}</div>
   ${r.q.proof?proofReview(r):`<table class="rv"><tr><th>Part</th><th>Your answer</th><th>Correct</th><th></th></tr>${r.rows.map(x=>`<tr><td>${esc(x.p.l)}</td><td>${show(x.p,x.a)}</td><td><b>${key(x.p)}</b></td><td>${x.ok?'\u2705':'\u274C'}</td></tr>`).join('')}</table>
   ${S.work[r.q.n]?`<small class="m">Your work:</small><div style="white-space:pre-wrap;background:#f1f5f9;border-radius:8px;padding:8px;font-size:14px">${esc(S.work[r.q.n])}</div>`:''}`}
   <div class="sol"><b>Worked solution</b>${r.q.sol}</div></div>`).join('')}
  <div class="row"><button class="pri" id="bNewT">New test (new numbers)</button><button class="sec" id="bHome">Back to start</button></div>`;
  $('#bNewT').onclick=()=>begin({seed:1+Math.floor(Math.random()*899999),ans:{},work:{},end:Date.now()+SECS*1000,done:false});
  $('#bHome').onclick=home;window.scrollTo(0,0)}
(function init(){const sv=store.get();
  if(sv&&!sv.done&&sv.end<=Date.now()){S=sv;setT();submit(true);return}
  home()})();
</script>
